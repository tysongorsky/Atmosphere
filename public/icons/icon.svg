const test = require('node:test');
const assert = require('node:assert/strict');
const { parseArtDmxPacket, parseSacnPacket } = require('../server/lighting');

test('Malformed packets are rejected safely', () => {
  const artnet = parseArtDmxPacket(Buffer.from('bad-artnet'), { source: '127.0.0.1' });
  const sacn = parseSacnPacket(Buffer.from('bad-sacn'), { source: '127.0.0.1' });

  assert.equal(artnet.ok, false);
  assert.equal(sacn.ok, false);
});
