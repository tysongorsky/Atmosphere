<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atmosphere</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/audience.css" />
  </head>
  <body class="audience-page">
    <main class="audience-shell">
      <header>
        <p class="eyebrow">Community Lighting</p>
        <h1>Atmosphere</h1>
      </header>

      <section class="hero-panel">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>
      </section>

      <section class="cta-row">
        <button class="scene-button" data-scene="festival">Festival</button>
        <button class="scene-button" data-scene="sunset">Sunset</button>
        <button class="scene-button" data-scene="pulse">Pulse</button>
      </section>
    </main>

    <script src="/audience.js"></script>
  </body>
</html>
